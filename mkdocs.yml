site_name: boxfish
site_description: LLM 공부 정리본
docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.top       # 우측 상단 "맨 위로" 버튼
    - navigation.footer    # 이전/다음 챕터 이동
    - content.code.copy    # 코드블록 복사 버튼
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

markdown_extensions:
  - admonition             # !!! note 박스
  - pymdownx.details       # 접히는 박스
  - pymdownx.superfences   # 중첩 코드블록
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

# 챕터 추가 = 아래 nav에 한 줄. 순서도 여기가 결정한다(파일명 아님).
nav:
  - 홈: index.md
  - "1. LLM 소개": 01-intro.md
  - "2. 로컬 LLM": 02-local-llm.md
  - "3. HuggingFace 모델 다운로드 & 추론": 03-hf-inference.md
  - "4. 토크나이저": 04-tokenizer.md
  - "5. 임베딩": 05-embedding.md
